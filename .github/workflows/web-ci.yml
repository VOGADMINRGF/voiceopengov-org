name: Web CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Web quality + production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand CI contract
        run: |
          set -euo pipefail
          test -f apps/web/src/app/brand-ci.css
          globals_line="$(grep -nF 'import "./globals.css";' apps/web/src/app/layout.tsx | head -1 | cut -d: -f1)"
          brand_line="$(grep -nF 'import "./brand-ci.css";' apps/web/src/app/layout.tsx | head -1 | cut -d: -f1)"
          test -n "$globals_line"
          test -n "$brand_line"
          test "$brand_line" -gt "$globals_line"
          grep -F '#020617' apps/web/src/app/brand-ci.css
          grep -F '#1a8cff' apps/web/src/app/brand-ci.css
          grep -F '#18cfc8' apps/web/src/app/brand-ci.css
          grep -F '#f8fafc' apps/web/src/app/brand-ci.css
          if grep -Eq -- '--vog-accent:[[:space:]]*#d6ff65|--vog-green:[[:space:]]*#48a78f' apps/web/src/app/brand-ci.css; then
            echo 'Legacy lime/green must not become canonical VoiceOpenGov brand tokens.' >&2
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck web
        run: pnpm -C apps/web exec tsc --noEmit -p tsconfig.json

      - name: Membership + funding contract tests
        run: pnpm -C apps/web run test:membership-funding

      - name: Regional architecture contract tests
        run: pnpm -C apps/web run test:regional-contract

      - name: SEO + search acquisition contract tests
        run: pnpm -C apps/web run test:seo-search-contract

      - name: Public accessibility + performance + security contract
        run: pnpm -C apps/web exec vitest run tests/public-hardening.contract.test.ts

      - name: Production build
        run: pnpm build

      - name: Install isolated browser accessibility runtime
        run: |
          set -euo pipefail
          mkdir -p /tmp/vog-browser
          cd /tmp/vog-browser
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-package-lock playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: "Production smoke: membership, participation and browser accessibility"
        run: |
          set -euo pipefail
          pnpm -C apps/web start > /tmp/vog-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat /tmp/vog-next.log
              exit 1
            fi
            sleep 1
          done

          SMOKE_BASE_URL=http://127.0.0.1:3000 node apps/web/scripts/smoke-membership-funding.mjs

          curl -fsS http://127.0.0.1:3000/mitmachen >/dev/null
          curl -fsS http://127.0.0.1:3000/fragen >/dev/null
          curl -fsS http://127.0.0.1:3000/regionen/deutschland >/dev/null
          curl -fsS http://127.0.0.1:3000/regionen/deutschland/berlin >/dev/null
          curl -fsS http://127.0.0.1:3000/regionen/deutschland/brandenburg \
            | grep -Ei '<meta[^>]+name="robots"[^>]+content="noindex[^\"]*follow|<meta[^>]+content="noindex[^\"]*follow"[^>]+name="robots"'
          curl -fsS http://127.0.0.1:3000/regionen/deutschland/brandenburg \
            | grep -F 'href="/mitmachen#vor-ort"'

          curl -sSI http://127.0.0.1:3000/rollen \
            | tr -d '\r' \
            | grep -Ei '^location: (https?://[^/]+)?/mitmachen([?#].*)?$'

          curl -sSI http://127.0.0.1:3000/mitmachen/rollen \
            | tr -d '\r' \
            | grep -Ei '^location: (https?://[^/]+)?/mitmachen([?#].*)?$'

          curl -sSI http://127.0.0.1:3000/vor-ort \
            | tr -d '\r' \
            | grep -Ei '^location: (https?://[^/]+)?/mitmachen#vor-ort$'

          curl -sSI http://127.0.0.1:3000/ \
            | tr -d '\r' \
            | grep -Fi 'x-content-type-options: nosniff'
          curl -sSI http://127.0.0.1:3000/ \
            | tr -d '\r' \
            | grep -Fi 'referrer-policy: strict-origin-when-cross-origin'
          curl -sSI http://127.0.0.1:3000/ \
            | tr -d '\r' \
            | grep -Fi 'strict-transport-security: max-age=31536000'

          NODE_PATH=/tmp/vog-browser/node_modules \
            SMOKE_BASE_URL=http://127.0.0.1:3000 \
            node apps/web/scripts/browser-a11y-regression.cjs

      - name: Notify IndexNow after successful Vercel production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node apps/web/scripts/submit-indexnow-after-vercel.mjs

      - name: Print app log on failure
        if: failure()
        run: tail -n 250 /tmp/vog-next.log 2>/dev/null || true
