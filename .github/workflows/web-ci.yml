name: Web CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Brand CI contract
        run: |
          test -f apps/web/src/app/brand-ci.css
          globals_line="$(grep -nF 'import "./globals.css";' apps/web/src/app/layout.tsx | head -1 | cut -d: -f1)"
          brand_line="$(grep -nF 'import "./brand-ci.css";' apps/web/src/app/layout.tsx | head -1 | cut -d: -f1)"
          test -n "$globals_line"
          test -n "$brand_line"
          test "$brand_line" -gt "$globals_line"
          grep -F '#020617' apps/web/src/app/brand-ci.css
          grep -F '#1a8cff' apps/web/src/app/brand-ci.css
          grep -F '#18cfc8' apps/web/src/app/brand-ci.css
          grep -F '#f8fafc' apps/web/src/app/brand-ci.css
          if grep -Eq -- '--vog-accent:[[:space:]]*#d6ff65|--vog-green:[[:space:]]*#48a78f' apps/web/src/app/brand-ci.css; then
            echo 'Legacy lime/green must not become canonical VoiceOpenGov brand tokens.' >&2
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm -C apps/web exec tsc --noEmit -p tsconfig.json
      - run: pnpm -C apps/web run test:membership-funding
      - run: pnpm build
      - name: Membership and funding production smoke
        run: |
          pnpm -C apps/web start > /tmp/vog-next.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then cat /tmp/vog-next.log; exit 1; fi
            sleep 1
          done
          SMOKE_BASE_URL=http://127.0.0.1:3000 node apps/web/scripts/smoke-membership-funding.mjs
